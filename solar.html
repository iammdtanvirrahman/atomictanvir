<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AtomicTanvir • Solar System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{overflow:hidden;background:#02040a;color:#fff;font-family:Arial,Helvetica,sans-serif}
canvas{display:block;width:100vw;height:100vh}
.panel{position:fixed;top:18px;left:18px;width:min(340px,calc(100vw - 36px));padding:18px;border-radius:18px;background:rgba(7,11,22,.78);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(14px);z-index:10}
.panel h1{font-size:1.45rem;margin-bottom:8px;color:#8be9ff}.panel p{color:#c8d3e8;line-height:1.5;font-size:.92rem}
.stats{margin-top:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}.stat span{display:block;color:#8be9ff;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}.stat strong{font-size:1rem}
.controls{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px}button{border:none;border-radius:999px;padding:10px 16px;background:linear-gradient(135deg,#6ae3ff,#3c7cff);color:#03111f;font-weight:700;cursor:pointer;transition:.2s;box-shadow:0 10px 24px rgba(60,124,255,.28)}button:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(60,124,255,.38)}
.tip{position:fixed;right:18px;bottom:18px;padding:12px 16px;border-radius:14px;background:rgba(7,11,22,.78);border:1px solid rgba(255,255,255,.08);color:#d9e7ff;font-size:.88rem;max-width:min(300px,calc(100vw - 36px));z-index:10}
.error{position:fixed;inset:auto 18px 18px 18px;max-width:720px;margin:auto;padding:12px 15px;border-radius:12px;background:rgba(255,70,100,.12);border:1px solid rgba(255,100,130,.28);color:#ffd9e1;display:none;z-index:20;font-size:.85rem}
@media(max-width:650px){.panel{top:10px;left:10px}.tip{right:10px;bottom:10px}.panel p{font-size:.84rem}}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
  }
}
</script>
</head>
<body>
<div class="panel">
  <h1>☀️ Solar System Explorer</h1>
  <p>Interactive 3D planetary system. Drag to orbit, scroll to zoom, and use the buttons to focus on major objects.</p>
  <div class="stats">
    <div class="stat"><span>Star</span><strong>Sun</strong></div>
    <div class="stat"><span>Planets</span><strong>8</strong></div>
    <div class="stat"><span>Moons</span><strong>Earth + more</strong></div>
    <div class="stat"><span>Renderer</span><strong>WebGL</strong></div>
  </div>
  <div class="controls">
    <button id="focusSun">Focus Sun</button>
    <button id="focusEarth">Focus Earth</button>
    <button id="focusJupiter">Focus Jupiter</button>
  </div>
</div>
<div class="tip">Drag to rotate • wheel/pinch to zoom</div>
<div class="error" id="errorBox"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/controls/OrbitControls.js';

const errorBox=document.getElementById('errorBox');
function showError(message){errorBox.textContent=message;errorBox.style.display='block';console.error(message)}

try{
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x01030a);

  const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,5000);
  camera.position.set(0,105,240);

  const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.15;
  document.body.appendChild(renderer.domElement);

  const controls=new OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;
  controls.dampingFactor=.06;
  controls.minDistance=28;
  controls.maxDistance=1000;
  controls.target.set(0,0,0);

  // Soft fill light + sunlight for visible planetary colors.
  scene.add(new THREE.HemisphereLight(0x9fc4ff,0x10131c,0.48));
  const sunLight=new THREE.PointLight(0xfff0c4,4.8,1800,1.8);
  sunLight.position.set(0,0,0);
  scene.add(sunLight);

  // Star field.
  const starGeo=new THREE.BufferGeometry();
  const starCount=6500;
  const starPos=new Float32Array(starCount*3);
  for(let i=0;i<starCount;i++){
    const r=900+Math.random()*1800;
    const u=Math.random()*2-1;
    const a=Math.random()*Math.PI*2;
    const s=Math.sqrt(1-u*u);
    starPos[i*3]=r*s*Math.cos(a);
    starPos[i*3+1]=r*u;
    starPos[i*3+2]=r*s*Math.sin(a);
  }
  starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));
  const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:1.6,sizeAttenuation:true,transparent:true,opacity:.9}));
  scene.add(stars);

  // Sun.
  const sun=new THREE.Mesh(
    new THREE.SphereGeometry(15.5,64,64),
    new THREE.MeshBasicMaterial({color:0xffb42d})
  );
  scene.add(sun);
  const glow=new THREE.Mesh(
    new THREE.SphereGeometry(20.5,48,48),
    new THREE.MeshBasicMaterial({color:0xffb84a,transparent:true,opacity:.16,side:THREE.BackSide,blending:THREE.AdditiveBlending})
  );
  scene.add(glow);

  const orbitMaterial=new THREE.LineBasicMaterial({color:0x3c506f,transparent:true,opacity:.65});
  const planets={};
  const defs=[
    {name:'Mercury',color:0xa8a8a8,size:2.2,d:28,s:.025},
    {name:'Venus',color:0xd5a66c,size:3.6,d:42,s:.018},
    {name:'Earth',color:0x2877ff,size:4,d:58,s:.013,moon:true},
    {name:'Mars',color:0xd05a3a,size:3.1,d:74,s:.010},
    {name:'Jupiter',color:0xd2a67c,size:9.5,d:104,s:.006},
    {name:'Saturn',color:0xd6c08c,size:8.2,d:136,s:.0045,ring:true},
    {name:'Uranus',color:0x62d9e8,size:6.2,d:168,s:.0032},
    {name:'Neptune',color:0x4164e8,size:6,size2:6,d:198,s:.0026}
  ];

  for(let i=0;i<defs.length;i++){
    const p=defs[i];
    const orbit=new THREE.Group();
    scene.add(orbit);

    const curve=new THREE.EllipseCurve(0,0,p.d,p.d,0,Math.PI*2,false,0);
    const pts=curve.getPoints(192).map(v=>new THREE.Vector3(v.x,0,v.y));
    const line=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),orbitMaterial);
    line.rotation.x=Math.PI/2;
    scene.add(line);

    const mesh=new THREE.Mesh(
      new THREE.SphereGeometry(p.size,40,40),
      new THREE.MeshLambertMaterial({color:p.color})
    );
    mesh.position.x=p.d;
    orbit.add(mesh);

    if(p.ring){
      const ring=new THREE.Mesh(
        new THREE.RingGeometry(p.size*1.35,p.size*2.05,96),
        new THREE.MeshBasicMaterial({color:0xe8d9aa,side:THREE.DoubleSide,transparent:true,opacity:.85})
      );
      ring.rotation.x=Math.PI/2;
      mesh.add(ring);
    }

    if(p.moon){
      const moonOrbit=new THREE.Group();
      mesh.add(moonOrbit);
      const moon=new THREE.Mesh(new THREE.SphereGeometry(1.05,24,24),new THREE.MeshLambertMaterial({color:0xcfd3da}));
      moon.position.x=8;
      moonOrbit.add(moon);
      p.moonOrbit=moonOrbit;
    }

    orbit.rotation.y=i*Math.PI/6;
    p.orbit=orbit;
    p.mesh=mesh;
    planets[p.name]=mesh;
  }

  function focus(object,distance){
    controls.target.copy(object.getWorldPosition(new THREE.Vector3()));
    camera.position.copy(controls.target).add(new THREE.Vector3(distance,distance*.35,distance));
  }
  document.getElementById('focusSun').onclick=()=>focus(sun,65);
  document.getElementById('focusEarth').onclick=()=>focus(planets.Earth,25);
  document.getElementById('focusJupiter').onclick=()=>focus(planets.Jupiter,42);

  addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });

  const clock=new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const t=clock.getElapsedTime();
    sun.rotation.y+=.0025;
    glow.rotation.y-=.0015;
    stars.rotation.y+=.00005;
    defs.forEach((p,i)=>{
      p.orbit.rotation.y+=p.s;
      p.mesh.rotation.y+=.008+i*.0008;
      if(p.moonOrbit)p.moonOrbit.rotation.y=t*1.3;
    });
    controls.update();
    renderer.render(scene,camera);
  }
  animate();
}catch(err){
  showError('Solar System could not start: '+(err?.message||err));
}
</script>
</body>
</html>

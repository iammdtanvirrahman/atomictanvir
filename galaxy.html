
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milky Way Simulation - Cinematic Realism</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #010103;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #ui-panel {
        position: absolute;
        bottom: 20px;
        left: 20px;
        color: #e2e8f0;
        background: rgba(3, 7, 18, 0.85);
        padding: 22px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        pointer-events: none;
        max-width: 360px;
        font-size: 13px;
        line-height: 1.6;
        backdrop-filter: blur(16px);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
    }
    #ui-panel h1 {
        margin: 0 0 4px 0;
        font-size: 22px;
        color: #ffffff;
        font-weight: 800;
        letter-spacing: -0.5px;
    }
    .accent { color: #f59e0b; font-weight: bold; }
</style>
</head>
<body>

<div id="ui-panel">
    <h1>Milky Way Galaxy</h1>
    <span style="color:#94a3b8; font-style:italic; display:block; margin-bottom:12px;">Cinematic Astrophysical Rendering</span>
    • <span class="accent">Peanut Core:</span> Dense, volumetric 3D core profile.<br>
    • <span class="accent">Dynamic Extinction:</span> Soft dust clouds blocking background light.<br>
    • <span class="accent">S-Warp Vector:</span> Advanced outer disk gravity deformation.<br>
    <div style="margin-top: 14px; color:#64748b; font-size: 11px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px;">Simulation Engine Engine v2.0</div>
</div>

<script type="module">
import * as THREE from "https://esm.sh/three@0.160.0";
import { OrbitControls } from "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js";

// --- SCENE INITIALIZATION ---
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x010103, 0.012);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 28, 42);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.maxDistance = 100;
controls.minDistance = 3;

// --- CONFIGURATION ---
const TOTAL_STARS = 250000;
const BULGE_STARS = 60000;
const DUST_PARTICLES = 40000;
const GALAXY_RADIUS = 26; 
const BAR_LENGTH = 5.8;

const gaussian = () => (Math.random() + Math.random() + Math.random() - 1.5) * 2.0;

// High-Performance Buffers
const bulgeAngles = new Float32Array(BULGE_STARS);
const bulgeRadii = new Float32Array(BULGE_STARS);
const diskAngles = new Float32Array(TOTAL_STARS);
const diskRadii = new Float32Array(TOTAL_STARS);
const diskSpeeds = new Float32Array(TOTAL_STARS);
const dustTargets = new Int32Array(DUST_PARTICLES);

// ==========================================
// PROCEDURAL TEXTURE GENERATOR (The Realism Secret)
// ==========================================
function createParticleTexture(isDust = false) {
    const canvas = document.createElement('canvas');
    canvas.width = 32;
    canvas.height = 32;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    
    if (isDust) {
        // Dust needs a wide, ultra-soft falloff to look like gas clouds
        grad.addColorStop(0, 'rgba(16, 8, 4, 1.0)');
        grad.addColorStop(0.2, 'rgba(12, 6, 3, 0.6)');
        grad.addColorStop(0.6, 'rgba(5, 2, 1, 0.15)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0.0)');
    } else {
        // Stars need an intense core point with a realistic glowing aura
        grad.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
        grad.addColorStop(0.15, 'rgba(230, 240, 255, 0.8)');
        grad.addColorStop(0.4, 'rgba(100, 150, 255, 0.15)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0.0)');
    }
    
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 32, 32);
    const texture = new THREE.CanvasTexture(canvas);
    return texture;
}

const starTexture = createParticleTexture(false);
const dustTexture = createParticleTexture(true);

// ==========================================
// 1. HIGH-DENSITY PEANUT CORE
// ==========================================
const bulgeGeo = new THREE.BufferGeometry();
const bulgePos = new Float32Array(BULGE_STARS * 3);
const bulgeCols = new Float32Array(BULGE_STARS * 3);

for (let i = 0; i < BULGE_STARS; i++) {
    const x = gaussian() * (BAR_LENGTH / 2.1);
    const z = gaussian() * 1.0;
    let y = gaussian() * 0.75;

    const bulgeHeightLift = Math.abs(x) * 0.35;
    if (Math.random() > 0.35) {
        y += bulgeHeightLift * (Math.random() > 0.5 ? 1 : -1);
    }

    bulgePos[i * 3] = x;
    bulgePos[i * 3 + 1] = y;
    bulgePos[i * 3 + 2] = z;

    const rand = Math.random();
    let col = new THREE.Color(0xffe3d1); // Brilliant warm core yellow/white
    if (rand > 0.8) col.setHex(0xff6a22); 
    else if (rand > 0.4) col.setHex(0xffb866); 
    
    bulgeCols[i * 3] = col.r;
    bulgeCols[i * 3 + 1] = col.g;
    bulgeCols[i * 3 + 2] = col.b;

    bulgeRadii[i] = Math.sqrt(x * x + z * z);
    bulgeAngles[i] = Math.atan2(z, x);
}
bulgeGeo.setAttribute('position', new THREE.BufferAttribute(bulgePos, 3));
bulgeGeo.setAttribute('color', new THREE.BufferAttribute(bulgeCols, 3));

const bulgeMat = new THREE.PointsMaterial({
    size: 0.14,
    map: starTexture,
    vertexColors: true,
    transparent: true,
    opacity: 0.95,
    blending: THREE.AdditiveBlending,
    depthWrite: false
});
scene.add(new THREE.Points(bulgeGeo, bulgeMat));

// ==========================================
// VOLUMETRIC CORE AMBIENT GLOW
// ==========================================
const coreGlowGeo = new THREE.SphereGeometry(3.5, 32, 32);
const coreGlowMat = new THREE.MeshBasicMaterial({
    color: 0xffaa66,
    transparent: true,
    opacity: 0.09,
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide
});
scene.add(new THREE.Mesh(coreGlowGeo, coreGlowMat));


// ==========================================
// 2. CHROMATIC DISK & SPIRAL ARMS
// ==========================================
const diskGeo = new THREE.BufferGeometry();
const diskPos = new Float32Array(TOTAL_STARS * 3);
const diskCols = new Float32Array(TOTAL_STARS * 3);

const armAngles = [0, Math.PI / 2, Math.PI, Math.PI * 1.5];

for (let i = 0; i < TOTAL_STARS; i++) {
    let r = BAR_LENGTH/2 + Math.pow(Math.random(), 2.0) * (GALAXY_RADIUS - BAR_LENGTH/2);
    let armIdx = i % 5;
    let angle = 0;

    if (armIdx === 4) {
        angle = 1.3 + r * 0.13 + gaussian() * 0.25; // Orion Spur structure
    } else {
        const baseAngle = armAngles[armIdx];
        const pitch = 0.135; 
        const armNoise = Math.sin(r * 1.4) * 0.09 + gaussian() * 0.20;
        angle = baseAngle + Math.log(r / (BAR_LENGTH/2)) / pitch + armNoise;
        
        if (Math.abs(Math.sin(r * 0.8)) > 0.94) {
            r += gaussian() * 1.2; 
        }
    }

    let x = Math.cos(angle) * r;
    let z = Math.sin(angle) * r;
    let y = gaussian() * (0.45 * Math.exp(-r / 8) + 0.04);

    if (r > 10.5) {
        const warp = 0.48 * Math.pow((r - 10.5) / (GALAXY_RADIUS - 10.5), 2);
        y += Math.sin(angle) * warp;
    }

    diskPos[i * 3] = x;
    diskPos[i * 3 + 1] = y;
    diskPos[i * 3 + 2] = z;

    let col = new THREE.Color();
    const pRand = Math.random();
    if (pRand > 0.94) col.setHex(0x4499ff); // Electric Blue Supergiants
    else if (pRand > 0.82) col.setHex(0xffffff); // Crisp A-Type White
    else if (pRand > 0.45) col.setHex(0xffdfb0); // Warm Solar Suns
    else col.setHex(0xff5533); // Vivid Stellar Crimson

    diskCols[i * 3] = col.r;
    diskCols[i * 3 + 1] = col.g;
    diskCols[i * 3 + 2] = col.b;

    diskRadii[i] = r;
    diskAngles[i] = angle;
    diskSpeeds[i] = 0.0042 / (r * 0.07 + 1) + 0.0002;
}
diskGeo.setAttribute('position', new THREE.BufferAttribute(diskPos, 3));
diskGeo.setAttribute('color', new THREE.BufferAttribute(diskCols, 3));

const diskMat = new THREE.PointsMaterial({
    size: 0.11,
    map: starTexture,
    vertexColors: true,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false
});
scene.add(new THREE.Points(diskGeo, diskMat));


// ==========================================
// 3. REALISTIC DUST LANE LIGHT EXTINCTION
// ==========================================
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(DUST_PARTICLES * 3);
const dustCols = new Float32Array(DUST_PARTICLES * 3);

for (let i = 0; i < DUST_PARTICLES; i++) {
    // Cluster dust tightly along inner lanes where gas is heavy
    const targetStarIdx = Math.floor(Math.random() * (TOTAL_STARS * 0.65));
    dustTargets[i] = targetStarIdx; 
    const baseIdx = targetStarIdx * 3;

    // Displace slightly ahead of star clusters for realism
    const dx = diskPos[baseIdx] + gaussian() * 0.32;
    const dy = diskPos[baseIdx + 1] + gaussian() * 0.03;
    const dz = diskPos[baseIdx + 2] + gaussian() * 0.32;

    dustPos[i * 3] = dx;
    dustPos[i * 3 + 1] = dy;
    dustPos[i * 3 + 2] = dz;

    const cRand = Math.random();
    dustCols[i * 3] = 0.05 + cRand * 0.02;
    dustCols[i * 3 + 1] = 0.03 + cRand * 0.01;
    dustCols[i * 3 + 2] = 0.01;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dustGeo.setAttribute('color', new THREE.BufferAttribute(dustCols, 3));

const dustMat = new THREE.PointsMaterial({
    size: 1.1, // Massive particle size with soft texturing creates gas nebulae
    map: dustTexture,
    vertexColors: true,
    transparent: true,
    opacity: 0.65,
    blending: THREE.NormalBlending, // Crucial: Normal blending allows it to shade stars
    depthWrite: false
});
scene.add(new THREE.Points(dustGeo, dustMat));


// ==========================================
// 4. SOLAR SYSTEM TRACKER
// ==========================================
const sunRadius = 11.4;
const sunAngle = 2.15; 
const sunX = Math.cos(sunAngle) * sunRadius;
const sunZ = Math.sin(sunAngle) * sunRadius;
let sunY = gaussian() * 0.05 + Math.sin(sunAngle) * 0.02; 

const sunGeo = new THREE.SphereGeometry(0.16, 16, 16);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xffea4d, transparent: true, opacity: 1.0 });
const sunMesh = new THREE.Mesh(sunGeo, sunMat);
scene.add(sunMesh);

const sunGlowGeo = new THREE.RingGeometry(0.35, 0.45, 32);
const sunGlowMat = new THREE.MeshBasicMaterial({ color: 0xff3c00, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
const sunGlowMesh = new THREE.Mesh(sunGlowGeo, sunGlowMat);
sunGlowMesh.rotation.x = Math.PI / 2;
scene.add(sunGlowMesh);


// ==========================================
// RENDERING & KINEMATICS ENGINE
// ==========================================
const bPositions = bulgeGeo.attributes.position.array;
const dPositions = diskGeo.attributes.position.array;
const dustPositions = dustGeo.attributes.position.array;

let sunCurrentAngle = sunAngle;
const sunSpeed = 0.0042 / (sunRadius * 0.07 + 1) + 0.0002; 

function animate() {
    requestAnimationFrame(animate);

    // 1. Core rotation
    for (let i = 0; i < BULGE_STARS; i++) {
        bulgeAngles[i] += 0.0008;
        bPositions[i * 3] = Math.cos(bulgeAngles[i]) * bulgeRadii[i];
        bPositions[i * 3 + 2] = Math.sin(bulgeAngles[i]) * bulgeRadii[i];
    }

    // 2. Disk Stellar Dynamics & S-Warp
    for (let i = 0; i < TOTAL_STARS; i++) {
        diskAngles[i] += diskSpeeds[i];
        const r = diskRadii[i];
        const angle = diskAngles[i];

        dPositions[i * 3] = Math.cos(angle) * r;
        dPositions[i * 3 + 2] = Math.sin(angle) * r;

        if (r > 10.5) {
            const warp = 0.48 * Math.pow((r - 10.5) / (GALAXY_RADIUS - 10.5), 2);
            dPositions[i * 3 + 1] = Math.sin(angle) * warp;
        }
    }

    // 3. Sun Positioning System
    sunCurrentAngle += sunSpeed;
    const newSunX = Math.cos(sunCurrentAngle) * sunRadius;
    const newSunZ = Math.sin(sunCurrentAngle) * sunRadius;
    let newSunY = 0;
    if (sunRadius > 10.5) {
        const warp = 0.48 * Math.pow((sunRadius - 10.5) / (GALAXY_RADIUS - 10.5), 2);
        newSunY = Math.sin(sunCurrentAngle) * warp;
    }
    sunMesh.position.set(newSunX, newSunY, newSunZ);
    sunGlowMesh.position.set(newSunX, newSunY, newSunZ);

    // 4. Smooth fluid dust streaming vector mapping
    for (let i = 0; i < DUST_PARTICLES; i++) {
        const parentIdx3 = dustTargets[i] * 3;
        dustPositions[i * 3] += (dPositions[parentIdx3] - dustPositions[i * 3]) * 0.08;
        dustPositions[i * 3 + 1] += (dPositions[parentIdx3 + 1] - dustPositions[i * 3 + 1]) * 0.08;
        dustPositions[i * 3 + 2] += (dPositions[parentIdx3 + 2] - dustPositions[i * 3 + 2]) * 0.08;
    }

    bulgeGeo.attributes.position.needsUpdate = true;
    diskGeo.attributes.position.needsUpdate = true;
    dustGeo.attributes.position.needsUpdate = true;

    controls.update();
    renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AtomicTanvir • Galaxy Explorer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}body{font-family:Inter,Arial,sans-serif;background:#010207;color:#fff}canvas{display:block}
.ui{position:fixed;top:18px;left:18px;z-index:10;width:min(350px,calc(100vw - 36px));padding:18px;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:rgba(5,8,18,.76);backdrop-filter:blur(18px);box-shadow:0 18px 55px rgba(0,0,0,.35)}
.ui h1{font-size:1.45rem;margin-bottom:7px}.ui p{color:#aebbd0;font-size:.88rem;line-height:1.55}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.controls button{border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:9px 13px;background:rgba(255,255,255,.06);color:#dfeaff;font-weight:700;cursor:pointer}.controls button:hover{background:linear-gradient(135deg,#68e9ff,#6d7cff);color:#07111b}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.stat{padding:10px 11px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06)}.stat span{display:block;font-size:.68rem;color:#7feaff;text-transform:uppercase}.stat strong{font-size:.88rem}.tip{position:fixed;right:18px;bottom:18px;z-index:10;padding:10px 14px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(5,8,18,.72);color:#b9c5d8;font-size:.8rem}
#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#010207}.loadbox{text-align:center;color:#d8e9ff}.spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,.14);border-top-color:#73eaff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}#error{display:none;margin-top:12px;color:#ff9eb7;font-size:.8rem;line-height:1.4}
@media(max-width:650px){.ui{top:10px;left:10px}.tip{display:none}}
</style>
</head>
<body>
<div id="loading"><div class="loadbox"><div class="spinner"></div><div>Initializing galaxy…</div><div id="error"></div></div></div>
<div class="ui">
<h1>🌌 Galaxy Explorer</h1>
<p>A performance-safe procedural barred spiral galaxy with a dense core, stellar bar, four spiral arms, dust lanes and a faint outer halo.</p>
<div class="stats"><div class="stat"><span>Structure</span><strong>Barred Spiral</strong></div><div class="stat"><span>Stars</span><strong>45,000+</strong></div><div class="stat"><span>Controls</span><strong>Orbit + Zoom</strong></div><div class="stat"><span>Render</span><strong>WebGL</strong></div></div>
<div class="controls"><button id="toggle">Pause</button><button id="reset">Reset View</button><button id="speed">Slow Mode</button></div>
</div>
<div class="tip">Drag to rotate • Wheel to zoom</div>
<script type="module">
const loading=document.getElementById('loading');
const errorBox=document.getElementById('error');
try{
const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js');
const {OrbitControls}=await import('https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/controls/OrbitControls.js');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x010207);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,1200);
const startPos=new THREE.Vector3(0,30,58);camera.position.copy(startPos);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.045;controls.minDistance=9;controls.maxDistance=180;controls.target.set(0,0,0);

function texture(){const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');const g=x.createRadialGradient(16,16,0,16,16,16);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.16,'rgba(255,255,255,.95)');g.addColorStop(.42,'rgba(190,225,255,.3)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,32,32);return new THREE.CanvasTexture(c)}
const starTex=texture();
function normal(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(Math.PI*2*v)}
function color(){const r=Math.random();if(r<.08)return [0.56,.78,1];if(r<.18)return [.75,.87,1];if(r<.8)return [1,.94,.82];if(r<.95)return [1,.67,.42];return [1,.42,.25]}

const galaxy=new THREE.Group();galaxy.rotation.x=THREE.MathUtils.degToRad(-10);scene.add(galaxy);

// Background field
const bgN=3500,bgP=new Float32Array(bgN*3);for(let i=0;i<bgN;i++){const r=260+Math.random()*450,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);bgP[i*3]=r*Math.sin(p)*Math.cos(t);bgP[i*3+1]=r*Math.cos(p);bgP[i*3+2]=r*Math.sin(p)*Math.sin(t)}
const bgG=new THREE.BufferGeometry();bgG.setAttribute('position',new THREE.BufferAttribute(bgP,3));scene.add(new THREE.Points(bgG,new THREE.PointsMaterial({map:starTex,size:.75,color:0xbad4ff,transparent:true,opacity:.38,depthWrite:false,blending:THREE.AdditiveBlending})));

// Main spiral disk. Static particle positions are used for stability; the whole galaxy rotates smoothly.
const N=45000,R=39,ARMS=4,pos=new Float32Array(N*3),col=new Float32Array(N*3);
for(let i=0;i<N;i++){
 const r=3+Math.pow(Math.random(),.67)*(R-3);const arm=i%ARMS;const base=arm*Math.PI*2/ARMS;const a=base+r*.118+r*r*.0016+normal()*(.08+.45*r/R);const x=Math.cos(a)*r;const z=Math.sin(a)*r;const y=normal()*(.18+.68*Math.exp(-r/12));pos[i*3]=x;pos[i*3+1]=y;pos[i*3+2]=z;const c=color();col[i*3]=c[0];col[i*3+1]=c[1];col[i*3+2]=c[2];
}
const diskG=new THREE.BufferGeometry();diskG.setAttribute('position',new THREE.BufferAttribute(pos,3));diskG.setAttribute('color',new THREE.BufferAttribute(col,3));galaxy.add(new THREE.Points(diskG,new THREE.PointsMaterial({map:starTex,size:.12,vertexColors:true,transparent:true,opacity:.92,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true})));

// Dense bulge
const B=12000,bp=new Float32Array(B*3),bc=new Float32Array(B*3);for(let i=0;i<B;i++){bp[i*3]=normal()*4.1;bp[i*3+1]=normal()*1.45;bp[i*3+2]=normal()*2.25;bc[i*3]=1;bc[i*3+1]=.78+Math.random()*.17;bc[i*3+2]=.52+Math.random()*.2}
const bg2=new THREE.BufferGeometry();bg2.setAttribute('position',new THREE.BufferAttribute(bp,3));bg2.setAttribute('color',new THREE.BufferAttribute(bc,3));galaxy.add(new THREE.Points(bg2,new THREE.PointsMaterial({map:starTex,size:.15,vertexColors:true,transparent:true,opacity:.92,depthWrite:false,blending:THREE.AdditiveBlending})));

// Stellar bar
const bar=new THREE.Mesh(new THREE.CapsuleGeometry(1.65,10,10,20),new THREE.MeshBasicMaterial({color:0xffc77f,transparent:true,opacity:.16,blending:THREE.AdditiveBlending}));bar.rotation.z=Math.PI/2;galaxy.add(bar);

// Dust bands
const D=7000,dp=new Float32Array(D*3),dc=new Float32Array(D*3);for(let i=0;i<D;i++){const arm=i%ARMS,r=5+Math.random()*32,a=arm*Math.PI*2/ARMS+r*.118+r*r*.0016+.34+normal()*.08,off=normal()*(.25+.4*r/R);dp[i*3]=Math.cos(a)*r+Math.cos(a+Math.PI/2)*off;dp[i*3+1]=normal()*.14;dp[i*3+2]=Math.sin(a)*r+Math.sin(a+Math.PI/2)*off;dc[i*3]=.055;dc[i*3+1]=.034;dc[i*3+2]=.022}
const dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(dp,3));dg.setAttribute('color',new THREE.BufferAttribute(dc,3));galaxy.add(new THREE.Points(dg,new THREE.PointsMaterial({map:starTex,size:.45,vertexColors:true,transparent:true,opacity:.16,depthWrite:false})));

const glow=new THREE.Mesh(new THREE.SphereGeometry(3.8,32,32),new THREE.MeshBasicMaterial({color:0xffbd75,transparent:true,opacity:.12,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false}));galaxy.add(glow);

let paused=false,slow=false;
document.getElementById('toggle').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};
document.getElementById('speed').onclick=e=>{slow=!slow;e.target.textContent=slow?'Normal Speed':'Slow Mode'};
document.getElementById('reset').onclick=()=>{camera.position.copy(startPos);controls.target.set(0,0,0);controls.update()};
renderer.domElement.addEventListener('dblclick',()=>{camera.position.copy(startPos);controls.target.set(0,0,0);controls.update()});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

// Remove the loading screen only after the renderer and scene are successfully initialized.
loading.style.opacity='0';setTimeout(()=>loading.remove(),350);
let last=performance.now();
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/16.67,2);last=now;if(!paused){galaxy.rotation.y+=0.00075*dt*(slow?.35:1);glow.scale.setScalar(1+.02*Math.sin(now*.0012))}controls.update();renderer.render(scene,camera)}
animate(performance.now());
}catch(err){console.error(err);document.querySelector('.spinner')?.remove();errorBox.style.display='block';errorBox.textContent='Galaxy renderer failed to initialize. Refresh once to retry.';}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#020307">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>AtomicTanvir • Galaxy Explorer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#020307}
body{font-family:Inter,Arial,sans-serif;color:#eef4ff}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.dragging{cursor:grabbing}
#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(circle at center,#101934 0,#05070f 46%,#020307 100%);transition:opacity .45s ease}
#loading.hide{opacity:0;pointer-events:none}
.loadbox{width:min(440px,calc(100vw - 32px));padding:28px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:rgba(7,10,18,.86);backdrop-filter:blur(18px);box-shadow:0 28px 90px rgba(0,0,0,.55)}
.brand{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#8de9ff;font-weight:800}.title{font-size:1.65rem;font-weight:800;margin-top:8px}.status{min-height:22px;margin-top:6px;color:#9eacc1;font-size:.86rem}.progress{margin-top:19px;height:9px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#74ebff,#7f88ff);border-radius:999px;transition:width .08s linear}.row{display:flex;justify-content:space-between;margin-top:9px;color:#738198;font-size:.76rem}.pct{color:#edf6ff;font-weight:800}
.ui{position:fixed;left:18px;top:18px;z-index:10;width:min(335px,calc(100vw - 36px));padding:18px;border-radius:20px;border:1px solid rgba(255,255,255,.09);background:rgba(6,9,18,.64);backdrop-filter:blur(16px);box-shadow:0 18px 55px rgba(0,0,0,.28)}
.ui h1{font-size:1.35rem;margin-bottom:6px}.ui p{font-size:.84rem;line-height:1.5;color:#aab6c9}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.controls button{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.055);color:#e9f3ff;border-radius:999px;padding:9px 13px;font-weight:700;cursor:pointer}.controls button:hover{background:rgba(124,233,255,.14);border-color:rgba(124,233,255,.23)}
.hint{position:fixed;right:18px;bottom:18px;z-index:10;padding:10px 14px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(6,9,18,.6);backdrop-filter:blur(14px);color:#b8c5d8;font-size:.78rem}
#error{display:none;margin-top:12px;color:#ff9db8;font-size:.8rem;line-height:1.45}
@media(max-width:650px){.ui{left:10px;top:10px}.hint{display:none}}
</style>
</head>
<body>
<div id="loading"><div class="loadbox"><div class="brand">AtomicTanvir</div><div class="title">Building Galaxy</div><div class="status" id="status">Preparing live simulation…</div><div class="progress"><div class="bar" id="bar"></div></div><div class="row"><span>Loading simulation layers</span><span class="pct" id="pct">0%</span></div><div id="error"></div></div></div>
<div class="ui">
  <h1>🌌 Galaxy Explorer</h1>
  <p>Live procedural spiral galaxy with moving stars, dust lanes, a luminous core, teal outer haze and interactive camera control.</p>
  <div class="controls"><button id="pause">Pause</button><button id="reset">Reset View</button><button id="speed">Slow Mode</button></div>
</div>
<div class="hint">Drag to orbit • Wheel / pinch to zoom • Double-click to reset</div>
<canvas id="galaxy"></canvas>
<script>
(() => {
  const canvas=document.getElementById('galaxy');
  const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
  const loading=document.getElementById('loading');
  const bar=document.getElementById('bar');
  const pct=document.getElementById('pct');
  const status=document.getElementById('status');
  const error=document.getElementById('error');
  if(!ctx){error.style.display='block';error.textContent='Canvas renderer unavailable.';return;}

  const TAU=Math.PI*2;
  const ARM_COUNT=4;
  const STAR_COUNT=14500;
  const DUST_COUNT=3200;
  const BG_COUNT=1500;
  const stars=[];
  const dust=[];
  const bg=[];
  let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,1.5);
  let cx=W/2,cy=H/2,radius=0,zoom=1,panX=0,panY=0,viewRotation=0;
  let paused=false,slow=false,dragging=false,lastPointerX=0,lastPointerY=0,lastTime=performance.now();

  function setProgress(v,text){v=Math.max(0,Math.min(100,Math.round(v)));bar.style.width=v+'%';pct.textContent=v+'%';status.textContent=text;}
  const yieldFrame=()=>new Promise(resolve=>setTimeout(resolve,0));
  const rand=(a,b)=>a+Math.random()*(b-a);
  function normal(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v)}
  function color(){const r=Math.random();if(r<.07)return [120,185,255];if(r<.18)return [190,220,255];if(r<.73)return [255,245,218];if(r<.94)return [255,207,147];return [255,148,105]}

  function resize(){
    W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,1.5);
    canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
    cx=W/2;cy=H/2;radius=Math.min(W,H)*.43;
  }

  async function build(){
    resize();
    setProgress(3,'Preparing deep-space field…');
    for(let i=0;i<BG_COUNT;i++){
      const a=Math.random()*TAU,r=Math.pow(Math.random(),.48)*1.65;
      bg.push({r, a, size:rand(.3,1.7), alpha:rand(.18,.8)});
      if(i%150===0){setProgress(3+(i/BG_COUNT)*7,'Preparing deep-space field…');await yieldFrame();}
    }

    setProgress(12,'Generating stellar arms…');
    for(let i=0;i<STAR_COUNT;i++){
      const r=.035+Math.pow(Math.random(),.58)*.965;
      const arm=i%ARM_COUNT;
      const armBase=arm*TAU/ARM_COUNT;
      const spread=.035+.145*r;
      const angle=armBase+2.12*r+1.72*r*r+normal()*spread;
      const eccentric=1-.055*Math.pow(r,1.65);
      const x=Math.cos(angle)*r*eccentric;
      const y=Math.sin(angle)*r;
      const c=color();
      stars.push({
        r,
        a:angle,
        x,y,
        size:rand(.23,.78)*(r<.2?1.25:1),
        c,
        alpha:rand(.35,.92),
        speed:(.0018/(.22+r*.78))*(.55+Math.random()*.65),
        phase:Math.random()*TAU,
        twinkle:rand(.3,1.4)
      });
      if(i%500===0){setProgress(12+(i/STAR_COUNT)*48,'Generating stellar arms…');await yieldFrame();}
    }

    setProgress(61,'Generating dust lanes…');
    for(let i=0;i<DUST_COUNT;i++){
      const r=.08+Math.pow(Math.random(),.62)*.9;
      const arm=i%ARM_COUNT;
      const lane=arm*TAU/ARM_COUNT+2.12*r+1.72*r*r+.27;
      dust.push({r,a:lane+normal()*(.025+.075*r),offset:normal()*(.006+.035*r),size:rand(.8,2.8),alpha:rand(.02,.085),speed:(.0012/(.3+r))*(.6+Math.random()*.7),phase:Math.random()*TAU});
      if(i%300===0){setProgress(61+(i/DUST_COUNT)*18,'Generating dust lanes…');await yieldFrame();}
    }

    setProgress(80,'Creating luminous core…');
    await yieldFrame();
    setProgress(88,'Creating star-forming knots…');
    await yieldFrame();
    setProgress(95,'Starting live animation…');
    await yieldFrame();
    setProgress(100,'Galaxy ready');
    setTimeout(()=>loading.classList.add('hide'),180);
    setTimeout(()=>loading.remove(),700);
    requestAnimationFrame(animate);
  }

  function worldToScreen(x,y){
    const cr=Math.cos(viewRotation),sr=Math.sin(viewRotation);
    const rx=x*cr-y*sr,ry=x*sr+y*cr;
    return [cx+panX+rx*radius*zoom,cy+panY+ry*radius*zoom];
  }

  function drawBackground(time){
    ctx.fillStyle='#020307';ctx.fillRect(0,0,W,H);
    const outer=ctx.createRadialGradient(cx,cy,0,cx,cy,radius*1.5);
    outer.addColorStop(0,'rgba(251,182,111,.11)');
    outer.addColorStop(.18,'rgba(105,164,150,.12)');
    outer.addColorStop(.43,'rgba(38,93,104,.10)');
    outer.addColorStop(.72,'rgba(13,45,57,.07)');
    outer.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=outer;ctx.fillRect(0,0,W,H);

    for(const s of bg){
      const a=s.a+time*.00001;
      const x=cx+panX+Math.cos(a)*s.r*radius*.9;
      const y=cy+panY+Math.sin(a)*s.r*radius*.9;
      if(x<-5||x>W+5||y<-5||y>H+5)continue;
      ctx.fillStyle=`rgba(185,220,255,${s.alpha})`;
      ctx.beginPath();ctx.arc(x,y,s.size,0,TAU);ctx.fill();
    }
  }

  function drawArms(){
    // broad, multi-pass gaseous arms that remain visible between individual stars
    for(let arm=0;arm<ARM_COUNT;arm++){
      for(let pass=0;pass<14;pass++){
        ctx.beginPath();
        const base=arm*TAU/ARM_COUNT + pass*.002;
        for(let k=0;k<=120;k++){
          const r=.05+k/120*.96;
          const a=base+2.12*r+1.72*r*r;
          const jitter=Math.sin(k*.37+pass)*.003;
          const rr=r+jitter;
          const [x,y]=worldToScreen(Math.cos(a)*rr,Math.sin(a)*rr);
          if(k===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
        }
        const alpha=.0085+pass*.0014;
        ctx.strokeStyle=pass<7?`rgba(115,155,122,${alpha})`:`rgba(67,144,156,${alpha})`;
        ctx.lineWidth=(13-pass*.55)*zoom;
        ctx.stroke();
      }
    }
  }

  function drawDust(){
    ctx.save();
    ctx.globalCompositeOperation='multiply';
    for(const d of dust){
      const a=d.a;
      const r=d.r;
      const x=Math.cos(a)*r+Math.cos(a+Math.PI/2)*d.offset;
      const y=Math.sin(a)*r+Math.sin(a+Math.PI/2)*d.offset;
      const [sx,sy]=worldToScreen(x,y);
      const len=7+22*r;
      ctx.strokeStyle=`rgba(5,8,10,${d.alpha})`;
      ctx.lineWidth=d.size*(1+.5*r)*zoom;
      ctx.beginPath();ctx.moveTo(sx-len,sy-len*.15);ctx.lineTo(sx+len,sy+len*.15);ctx.stroke();
    }
    ctx.restore();
  }

  function drawStars(time){
    for(const p of stars){
      const rx=Math.cos(p.a)*p.r*(1-.055*Math.pow(p.r,1.65));
      const ry=Math.sin(p.a)*p.r;
      const [sx,sy]=worldToScreen(rx,ry);
      const tw=0.72+0.28*Math.sin(time*.001*p.twinkle+p.phase);
      const a=p.alpha*tw;
      ctx.fillStyle=`rgba(${p.c[0]},${p.c[1]},${p.c[2]},${a})`;
      ctx.beginPath();ctx.arc(sx,sy,Math.max(.32,p.size*zoom),0,TAU);ctx.fill();
    }
  }

  function drawKnots(time){
    for(let arm=0;arm<ARM_COUNT;arm++){
      for(let j=0;j<15;j++){
        const r=.18+j*.043+0.015*Math.sin(j*2+arm);
        const a=arm*TAU/ARM_COUNT+2.12*r+1.72*r*r+0.025*Math.sin(time*.0002+j);
        const [x,y]=worldToScreen(Math.cos(a)*r,Math.sin(a)*r);
        const g=ctx.createRadialGradient(x,y,0,x,y,10+10*r);
        g.addColorStop(0,'rgba(185,255,226,.20)');
        g.addColorStop(.4,'rgba(67,196,184,.08)');
        g.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,18+12*r,0,TAU);ctx.fill();
      }
    }
  }

  function drawCore(time){
    const breath=1+.035*Math.sin(time*.0013);
    const glowR=radius*.19*breath;
    const g=ctx.createRadialGradient(cx+panX,cy+panY,0,cx+panX,cy+panY,glowR);
    g.addColorStop(0,'rgba(255,255,245,1)');
    g.addColorStop(.08,'rgba(255,246,214,.98)');
    g.addColorStop(.25,'rgba(255,210,145,.75)');
    g.addColorStop(.48,'rgba(255,164,88,.33)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(cx+panX-glowR,cy+panY-glowR,glowR*2,glowR*2);
    const innerR=radius*.065*breath;
    const h=ctx.createRadialGradient(cx+panX,cy+panY,0,cx+panX,cy+panY,innerR);
    h.addColorStop(0,'rgba(255,255,250,1)');h.addColorStop(.35,'rgba(255,224,170,.95)');h.addColorStop(1,'rgba(255,120,55,0)');
    ctx.fillStyle=h;ctx.beginPath();ctx.arc(cx+panX,cy+panY,innerR,0,TAU);ctx.fill();
  }

  function drawVignette(){
    const g=ctx.createRadialGradient(cx,cy,Math.min(W,H)*.22,cx,cy,Math.min(W,H)*.72);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.5)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }

  function draw(time){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    drawBackground(time);
    drawArms();
    drawDust();
    drawStars(time);
    drawKnots(time);
    drawCore(time);
    drawVignette();
  }

  function animate(now){
    const dt=Math.min((now-lastTime)/16.67,2);lastTime=now;
    if(!paused){
      const factor=slow?.35:1;
      for(const p of stars)p.a+=p.speed*dt*factor;
      for(const d of dust)d.a+=d.speed*dt*factor;
      viewRotation+=.00003*dt*factor;
    }
    draw(now);
    requestAnimationFrame(animate);
  }

  canvas.addEventListener('pointerdown',e=>{dragging=true;lastPointerX=e.clientX;lastPointerY=e.clientY;canvas.classList.add('dragging');canvas.setPointerCapture(e.pointerId)});
  canvas.addEventListener('pointermove',e=>{if(!dragging)return;panX+=e.clientX-lastPointerX;panY+=e.clientY-lastPointerY;lastPointerX=e.clientX;lastPointerY=e.clientY});
  canvas.addEventListener('pointerup',e=>{dragging=false;canvas.classList.remove('dragging');try{canvas.releasePointerCapture(e.pointerId)}catch{}});
  canvas.addEventListener('pointercancel',()=>{dragging=false;canvas.classList.remove('dragging')});
  canvas.addEventListener('wheel',e=>{e.preventDefault();zoom*=e.deltaY<0?1.07:.935;zoom=Math.max(.55,Math.min(1.9,zoom))},{passive:false});
  canvas.addEventListener('dblclick',()=>{zoom=1;panX=0;panY=0;viewRotation=0});
  addEventListener('resize',()=>{resize();draw(performance.now())});

  document.getElementById('pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'Resume':'Pause'};
  document.getElementById('speed').onclick=e=>{slow=!slow;e.currentTarget.textContent=slow?'Normal Speed':'Slow Mode'};
  document.getElementById('reset').onclick=()=>{zoom=1;panX=0;panY=0;viewRotation=0};

  build();
})();
</script>
</body>
</html>

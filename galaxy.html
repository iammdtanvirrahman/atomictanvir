<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#01010d"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><link rel="icon" href="favicon.svg" type="image/svg+xml"><title>Galaxy — Deep Field Simulation</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01010d;color:#b8c8d8;font-family:Inter,Segoe UI,system-ui,sans-serif}*{box-sizing:border-box}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas.drag{cursor:grabbing}#load{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#01010d;transition:.6s}.hide{opacity:0;pointer-events:none}.box{width:min(400px,82vw);text-align:center}.t{font-size:1.4rem;letter-spacing:.32em;color:#e8d5a3}.s{font-size:.68rem;letter-spacing:.18em;color:#5a7080;margin:.5rem 0 2rem}.track{height:3px;background:#11151e}.bar{height:100%;width:0;background:linear-gradient(90deg,#f5c842,#4dd8e0);transition:.1s}.row{display:flex;justify-content:space-between;margin-top:8px;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em}.pct{color:#4dd8e0}#ui,#hud,#controls{position:fixed;z-index:10;opacity:0;transition:.5s}.show{opacity:1!important}#ui{left:1rem;top:1rem}.title{color:#e8d5a3;letter-spacing:.28em;font-size:.78rem}.sub{color:#5a7080;font-size:.58rem;letter-spacing:.15em;margin-top:4px}#hud{right:1rem;top:1rem;text-align:right;color:#5a7080;font-size:.62rem;line-height:1.8;letter-spacing:.1em}#controls{left:50%;bottom:1rem;transform:translateX(-50%);display:flex;gap:.5rem}.btn{background:rgba(3,5,18,.88);border:1px solid rgba(77,216,224,.2);color:#c6d4df;padding:.5rem .85rem;border-radius:4px;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.btn.active,.btn:hover{color:#4dd8e0;border-color:#4dd8e0}@media(max-width:500px){#hud{top:auto;bottom:4rem}.btn{padding:.45rem .65rem}}</style></head><body><canvas id="c"></canvas><div id="load"><div class="box"><div class="t">Deep Field</div><div class="s">Galaxy Simulation</div><div class="track"><div class="bar" id="bar"></div></div><div class="row"><span id="step">Initializing renderer</span><span class="pct" id="pct">0%</span></div></div></div><div id="ui"><div class="title">MILKY WAY TYPE SB</div><div class="sub">BARRED SPIRAL — REAL-TIME SIMULATION</div></div><div id="hud"><div id="stars">0 stars</div><div id="fps">0 fps</div><div>drag · scroll · pinch</div></div><div id="controls"><button class="btn" id="reset">Reset Camera</button><button class="btn" id="pause">Pause</button><button class="btn" id="slow">Slow Motion</button></div><script>'use strict';
const c=document.getElementById('c');
const gl=c.getContext('webgl2',{alpha:false,antialias:false,powerPreference:'high-performance'});
if(!gl){document.getElementById('step').textContent='WebGL2 unavailable';throw new Error('WebGL2 unavailable');}
const g=gl;
const load=document.getElementById('load'),bar=document.getElementById('bar'),pct=document.getElementById('pct'),step=document.getElementById('step'),ui=document.getElementById('ui'),hud=document.getElementById('hud'),controls=document.getElementById('controls'),starsHud=document.getElementById('stars'),fpsHud=document.getElementById('fps');
let W=1,H=1,D=1;
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.max(1,Math.floor(W*D));c.height=Math.max(1,Math.floor(H*D));g.viewport(0,0,c.width,c.height)}
size();addEventListener('resize',size);
const wait=()=>new Promise(r=>setTimeout(r,0)),TAU=Math.PI*2;
let seed=123456789;
function R(){seed^=seed<<13;seed^=seed>>17;seed^=seed<<5;return(seed>>>0)/4294967296}
function N(){let u=R()||.0001,v=R()||.0001;return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v)}
function col(){const r=R();return r<.08?[.5,.75,1]:r<.18?[.8,.9,1]:r<.78?[1,.96,.84]:r<.95?[1,.72,.45]:[1,.43,.28]}
function sh(t,s){const x=g.createShader(t);g.shaderSource(x,s);g.compileShader(x);if(!g.getShaderParameter(x,g.COMPILE_STATUS))throw new Error(g.getShaderInfoLog(x)||'Shader compile error');return x}
function prog(v,f){const p=g.createProgram();g.attachShader(p,sh(g.VERTEX_SHADER,v));g.attachShader(p,sh(g.FRAGMENT_SHADER,f));g.linkProgram(p);if(!g.getProgramParameter(p,g.LINK_STATUS))throw new Error(g.getProgramInfoLog(p)||'Program link error');return p}
const vs=`#version 300 es\nin vec3 p;in vec3 c;in float b;in float s;in float a;in float r;in float ph;uniform mat4 vp;uniform float t;uniform float speed;out vec3 C;out float B;void main(){float A=a+t*speed*(.75+.55/(.25+r));float x=r*cos(A),z=r*sin(A),y=p.y+.012*r*r*sin(A*1.8+ph);vec4 w=vec4(x,y,z,1.);gl_Position=vp*w;float q=max(1.,length(w.xyz));gl_PointSize=clamp(s*(1.5+24./q),.7,7.);C=c;B=b*(1.+.08*sin(t*3.+ph*12.));}`;
const fs=`#version 300 es\nprecision highp float;in vec3 C;in float B;out vec4 o;void main(){vec2 q=gl_PointCoord-.5;float d=dot(q,q)*4.;float a=exp(-d*3.6)*B,h=exp(-d*.8)*B*.25;o=vec4(C*(a+h),a+h*.5);}`;
const bgvs=`#version 300 es\nin vec3 p;in vec3 c;in float b;in float s;uniform mat4 vp;out vec3 C;out float B;void main(){gl_Position=vp*vec4(p,1.);gl_PointSize=s;C=c;B=b;}`;const bgfs=fs;
const P=prog(vs,fs),PB=prog(bgvs,bgfs);function L(p,n){return g.getAttribLocation(p,n)}const lp={p:L(P,'p'),c:L(P,'c'),b:L(P,'b'),s:L(P,'s'),a:L(P,'a'),r:L(P,'r'),ph:L(P,'ph')};const lu={vp:g.getUniformLocation(P,'vp'),t:g.getUniformLocation(P,'t'),speed:g.getUniformLocation(P,'speed')};const lb={p:L(PB,'p'),c:L(PB,'c'),b:L(PB,'b'),s:L(PB,'s')},bu={vp:g.getUniformLocation(PB,'vp')};
function buf(a){const b=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,b);g.bufferData(g.ARRAY_BUFFER,a,g.STATIC_DRAW);return b}
function bind(loc,b,n){if(loc<0)return;g.bindBuffer(g.ARRAY_BUFFER,b);g.enableVertexAttribArray(loc);g.vertexAttribPointer(loc,n,g.FLOAT,false,0,0)}
function make(n,type){const p=new Float32Array(n*3),cc=new Float32Array(n*3),b=new Float32Array(n),s=new Float32Array(n),a=new Float32Array(n),r=new Float32Array(n),ph=new Float32Array(n);for(let i=0;i<n;i++){let rr,aa;if(type===0){const th=Math.acos(2*R()-1),po=R()*TAU,rad=36+R()*38;p[i*3]=rad*Math.sin(th)*Math.cos(po);p[i*3+1]=rad*Math.cos(th);p[i*3+2]=rad*Math.sin(th)*Math.sin(po);aa=po;rr=rad}else if(type===1){rr=Math.pow(R(),.55)*.55;aa=R()*TAU;p[i*3]=N()*.2;p[i*3+1]=N()*.08;p[i*3+2]=N()*.2}else{const arm=i%4,baseArm=arm*TAU/4,q=Math.pow(R(),.7);rr=.08+q*2.7;aa=baseArm+2.25*q+1.55*q*q+N()*(type===2?.08+.08*q:.45);p[i*3]=rr*Math.cos(aa);p[i*3+1]=N()*(.03+.025*Math.exp(-rr));p[i*3+2]=rr*Math.sin(aa)}const C=type===1?[1,.82,.58]:col();cc[i*3]=C[0];cc[i*3+1]=C[1];cc[i*3+2]=C[2];b[i]=type===1?.25+R()*.7:.08+R()*.72;s[i]=type===0?.8+R()*1.5:1+R()*1.8;a[i]=aa;r[i]=Math.max(.01,rr);ph[i]=R()*TAU}return{p:buf(p),c:buf(cc),b:buf(b),s:buf(s),a:buf(a),r:buf(r),ph:buf(ph),n}}
let BG=null,BUL=null,DISK=null,ARMS=null;
async function build(){try{const mobile=innerWidth<700;const counts=[mobile?3500:7000,mobile?5000:10000,mobile?10000:22000,mobile?14000:30000];step.textContent='Background stars';bar.style.width='5%';pct.textContent='5%';BG=make(counts[0],0);await wait();bar.style.width='25%';pct.textContent='25%';step.textContent='Central bulge';BUL=make(counts[1],1);await wait();bar.style.width='52%';pct.textContent='52%';step.textContent='Galactic disk';DISK=make(counts[2],2);await wait();bar.style.width='82%';pct.textContent='82%';step.textContent='Spiral arms';ARMS=make(counts[3],3);await wait();bar.style.width='100%';pct.textContent='100%';step.textContent='Galaxy ready';await new Promise(r=>setTimeout(r,220));load.classList.add('hide');setTimeout(()=>{load.remove();ui.classList.add('show');hud.classList.add('show');controls.classList.add('show')},650);requestAnimationFrame(render)}catch(e){console.error(e);step.textContent='Generation error: '+(e?.message||e);}}
function perspective(f,a,n,fa){const q=1/Math.tan(f/2),m=new Float32Array(16);m[0]=q/a;m[5]=q;m[10]=(fa+n)/(n-fa);m[11]=-1;m[14]=2*fa*n/(n-fa);return m}
function look(e){const [x,y,z]=e,fl=Math.hypot(x,y,z)||1,fx=-x/fl,fy=-y/fl,fz=-z/fl;let rx=fy,ry=-fx,rz=0,rl=Math.hypot(rx,ry)||1;rx/=rl;ry/=rl;const ux=ry*fz,uy=rz*fx-rx*fz,uz=rx*fy;return new Float32Array([rx,ux,-fx,0,ry,uy,-fy,0,rz,uz,-fz,0,-(rx*x+ry*y+rz*z),-(ux*x+uy*y+uz*z),fx*x+fy*y+fz*z,1])}
function mul(a,b){const o=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++)for(let k=0;k<4;k++)o[i*4+j]+=a[i*4+k]*b[k*4+j];return o}
let th=.2,ph=0,dist=7.4,time=0,last=performance.now(),paused=false,slow=false;
function drawStars(bufObj,locs,program){if(!bufObj||!program)return;g.useProgram(program);bind(locs.p,bufObj.p,3);bind(locs.c,bufObj.c,3);bind(locs.b,bufObj.b,1);bind(locs.s,bufObj.s,1);if(locs.a!==undefined){bind(locs.a,bufObj.a,1);bind(locs.r,bufObj.r,1);bind(locs.ph,bufObj.ph,1)}g.drawArrays(g.POINTS,0,bufObj.n)}
function render(now){const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(!paused)time+=dt*(slow?.12:1);g.clearColor(.003,.003,.02,1);g.clear(g.COLOR_BUFFER_BIT);g.enable(g.BLEND);g.blendFunc(g.SRC_ALPHA,g.ONE);g.disable(g.DEPTH_TEST);const vp=mul(perspective(.68,c.width/c.height,.01,180),look([dist*Math.sin(th)*Math.cos(ph),dist*Math.cos(th),dist*Math.sin(th)*Math.sin(ph)]));if(BG){g.useProgram(PB);g.uniformMatrix4fv(bu.vp,false,vp);bind(lb.p,BG.p,3);bind(lb.c,BG.c,3);bind(lb.b,BG.b,1);bind(lb.s,BG.s,1);g.drawArrays(g.POINTS,0,BG.n)}g.useProgram(P);g.uniformMatrix4fv(lu.vp,false,vp);g.uniform1f(lu.t,time);g.uniform1f(lu.speed,.24);drawStars(BUL,lp,P);drawStars(DISK,lp,P);drawStars(ARMS,lp,P);starsHud.textContent=((BG?.n||0)+(BUL?.n||0)+(DISK?.n||0)+(ARMS?.n||0)).toLocaleString()+' stars';fpsHud.textContent=Math.round(1/Math.max(dt,.001))+' fps';requestAnimationFrame(render)}
function reset(){th=.2;ph=0;dist=7.4}document.getElementById('reset').onclick=reset;document.getElementById('pause').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'Resume':'Pause';e.currentTarget.classList.toggle('active',paused)};document.getElementById('slow').onclick=e=>{slow=!slow;e.currentTarget.classList.toggle('active',slow)};let drag=false,lx=0,ly=0;c.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;c.classList.add('drag');c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag)return;ph-=(e.clientX-lx)*.004;th=Math.max(.05,Math.min(Math.PI*.47,th+(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY});c.addEventListener('pointerup',e=>{drag=false;c.classList.remove('drag');try{c.releasePointerCapture(e.pointerId)}catch{}});c.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(2.7,Math.min(18,dist+e.deltaY*.008))},{passive:false});c.addEventListener('dblclick',reset);build();
})();</script></body></html>

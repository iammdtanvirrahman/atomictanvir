<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AtomicTanvir - IDE Admin Panel</title>
<style>
    :root {
        --bg-main: #080c14;
        --bg-card: #0f1626;
        --bg-editor: #050811;
        --accent-pink: #ff3377;
        --accent-cyan: #00ffcc;
        --text-muted: #8892b0;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background: radial-gradient(circle at center, #101626, #05070f);
        color: #e2e8f0;
        padding: 40px 20px;
        min-height: 100vh;
    }

    h1 {
        text-align: center;
        font-size: 2.5rem;
        letter-spacing: 1px;
        background: linear-gradient(45deg, var(--accent-pink), #ff0055);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 40px;
        font-weight: 800;
        filter: drop-shadow(0 0 15px rgba(255, 51, 119, 0.3));
    }

    .admin-container {
        max-width: 1100px;
        margin: auto;
    }
    
    .section-title {
        font-size: 1.4rem;
        font-weight: 600;
        padding-bottom: 8px;
        margin: 40px 0 20px;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .title-pending { color: var(--accent-pink); border-bottom: 2px solid rgba(255, 33, 119, 0.2); }
    .title-approved { color: var(--accent-cyan); border-bottom: 2px solid rgba(0, 255, 204, 0.2); }

    .submission-card {
        background: var(--bg-card);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        padding: 25px;
        margin-bottom: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        backdrop-filter: blur(10px);
    }
    
    .submission-card.approved {
        border-left: 4px solid var(--accent-cyan);
    }
    .submission-card.pending {
        border-left: 4px solid var(--accent-pink);
    }

    /* Meta Inputs Row */
    .meta-inputs {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
    }

    .input-field {
        flex: 1;
    }

    label {
        display: block;
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    input {
        width: 100%;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 12px;
        color: white;
        font-size: 0.95rem;
        outline: none;
        transition: 0.3s;
    }

    input:focus {
        border-color: #00bcd4;
        box-shadow: 0 0 10px rgba(0, 188, 212, 0.2);
    }

    /* --- Compiler Mockup UI --- */
    .ide-container {
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        margin-bottom: 15px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }

    .ide-header {
        background: #161c2c;
        padding: 10px 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(0,0,0,0.3);
    }

    .ide-dots {
        display: flex;
        gap: 8px;
    }

    .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
    }
    .dot-r { background: #ff5f56; }
    .dot-y { background: #ffbd2e; }
    .dot-g { background: #27c93f; }

    .ide-title {
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.85rem;
        color: #7f8c8d;
    }

    .ide-body {
        position: relative;
        background: var(--bg-editor);
    }

    textarea {
        width: 100%;
        background: transparent;
        border: none;
        padding: 20px;
        color: #00ffcc;
        font-family: 'Fira Code', 'Consolas', 'Courier New', Courier, monospace;
        font-size: 0.95rem;
        line-height: 1.6;
        resize: vertical;
        outline: none;
        min-height: 250px;
    }

    /* --- Controls Footer --- */
    .card-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
        padding-top: 15px;
        border-top: 1px solid rgba(255,255,255,0.05);
    }

    .meta-time {
        color: var(--text-muted);
        font-size: 0.8rem;
    }

    .btn-group {
        display: flex;
        gap: 12px;
    }

    .btn {
        padding: 10px 22px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9rem;
        transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .btn-publish {
        background: linear-gradient(135deg, #00ffcc, #00b3ff);
        color: #05070f;
    }
    .btn-publish:hover {
        box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
        transform: translateY(-2px);
    }

    .btn-save {
        background: rgba(0, 255, 204, 0.1);
        border: 1px solid var(--accent-cyan);
        color: var(--accent-cyan);
    }
    .btn-save:hover {
        background: var(--accent-cyan);
        color: #05070f;
        transform: translateY(-2px);
    }
    
    .btn-delete {
        background: rgba(255, 51, 119, 0.1);
        border: 1px solid var(--accent-pink);
        color: var(--accent-pink);
    }
    .btn-delete:hover {
        background: var(--accent-pink);
        color: white;
        box-shadow: 0 0 15px rgba(255, 51, 119, 0.3);
        transform: translateY(-2px);
    }

    .empty-msg {
        text-align: center;
        color: var(--text-muted);
        font-style: italic;
        padding: 20px;
        background: rgba(255,255,255,0.01);
        border-radius: 8px;
        border: 1px dashed rgba(255,255,255,0.05);
    }
</style>
</head>
<body>

    <h1>🛰️ ATOMIC CONTROL PANEL</h1>
    
    <div class="admin-container">
        <div class="section-title title-pending">📥 Pending Review</div>
        <div id="pendingList">
            <p style="text-align: center; color: var(--text-muted);">Fetching sandbox queues...</p>
        </div>

        <div class="section-title title-approved">✅ Live on Website</div>
        <div id="approvedList">
            <p style="text-align: center; color: var(--text-muted);">Fetching published archive...</p>
        </div>
    </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCit_SKjXRUpr8FNY1ahKhiG5sdDyOlW6k",
    authDomain: "atomictanvir.firebaseapp.com",
    projectId: "atomictanvir",
    storageBucket: "atomictanvir.firebasestorage.app",
    messagingSenderId: "140595401471",
    appId: "1:140595401471:web:8f92115a8c8b58d1ec32ca",
    measurementId: "G-WQG0CXS5NH",
    databaseURL: "https://atomictanvir-default-rtdb.firebaseio.com"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const subsRef = ref(db, 'submissions');
  
  onValue(subsRef, (snapshot) => {
      const pendingContainer = document.getElementById('pendingList');
      const approvedContainer = document.getElementById('approvedList');
      
      pendingContainer.innerHTML = '';
      approvedContainer.innerHTML = '';
      
      if(!snapshot.exists()) {
          pendingContainer.innerHTML = `<div class="empty-msg">No submissions found in database.</div>`;
          approvedContainer.innerHTML = `<div class="empty-msg">No published projects found.</div>`;
          return;
      }
      
      const data = snapshot.val();
      let hasPending = false;
      let hasApproved = false;

      // Sort by timestamp (newest first)
      const sortedKeys = Object.keys(data).sort((a,b) => data[b].timestamp - data[a].timestamp);

      sortedKeys.forEach((key) => {
          const sub = data[key];
          const date = new Date(sub.timestamp).toLocaleString();
          
          const card = document.createElement('div');
          card.className = `submission-card ${sub.approved ? 'approved' : 'pending'}`;
          
          card.innerHTML = `
              <div class="meta-inputs">
                  <div class="input-field">
                      <label>Simulation Title</label>
                      <input type="text" id="name-${key}" value="${escapeHTML(sub.modelName)}">
                  </div>
                  <div class="input-field">
                      <label>Creator / Author</label>
                      <input type="text" id="author-${key}" value="${escapeHTML(sub.authorName)}">
                  </div>
              </div>
              
              <div class="ide-container">
                  <div class="ide-header">
                      <div class="ide-dots">
                          <span class="dot dot-r"></span>
                          <span class="dot dot-y"></span>
                          <span class="dot dot-g"></span>
                      </div>
                      <div class="ide-title">${escapeHTML(sub.modelName.toLowerCase().replace(/\s+/g, '-')) || 'index'}.html</div>
                      <div style="width: 42px;"></div>
                  </div>
                  <div class="ide-body">
                      <textarea id="code-${key}" spellcheck="false" placeholder="Write or edit code here...">${escapeHTML(sub.code)}</textarea>
                  </div>
              </div>

              <div class="card-footer">
                  <div class="meta-time">Timestamp: ${date}</div>
                  <div class="btn-group">
                      ${!sub.approved 
                          ? `<button class="btn btn-publish" data-id="${key}">🚀 Approve & Publish</button>` 
                          : `<button class="btn btn-save" data-id="${key}">💾 Save Changes</button>`
                      }
                      <button class="btn btn-delete" data-id="${key}">🗑️ Delete</button>
                  </div>
              </div>
          `;

          if (sub.approved) {
              approvedContainer.appendChild(card);
              hasApproved = true;
          } else {
              pendingContainer.appendChild(card);
              hasPending = true;
          }
      });

      if(!hasPending) pendingContainer.innerHTML = `<div class="empty-msg">✨ Hurrah! No pending models to review.</div>`;
      if(!hasApproved) approvedContainer.innerHTML = `<div class="empty-msg">📁 No models are live yet. Approve code to display here.</div>`;

      // --- Button Logic Events ---
      
      // 1. Approve or Save Changes Button
      document.querySelectorAll('.btn-publish, .btn-save').forEach(btn => {
          btn.addEventListener('click', async (e) => {
              const id = e.currentTarget.getAttribute('data-id');
              const updatedName = document.getElementById(`name-${id}`).value.trim();
              const updatedAuthor = document.getElementById(`author-${id}`).value.trim();
              const updatedCode = document.getElementById(`code-${id}`).value.trim();

              if(updatedName && updatedAuthor && updatedCode) {
                  await update(ref(db, `submissions/${id}`), {
                      modelName: updatedName,
                      authorName: updatedAuthor,
                      code: updatedCode,
                      approved: true
                  });
                  alert("🌟 Code updated and published to the live stream successfully!");
              } else {
                  alert("Error: Fields cannot be left empty.");
              }
          });
      });

      // 2. Delete Button (Works seamlessly for both pending and published codes)
      document.querySelectorAll('.btn-delete').forEach(btn => {
          btn.addEventListener('click', async (e) => {
              const id = e.currentTarget.getAttribute('data-id');
              const isApproved = data[id].approved;
              
              const confirmMsg = isApproved 
                  ? "⚠️ WARNING:\nThis simulation is currently LIVE on your website. Deleting it will remove it from the homepage instantly. Proceed?"
                  : "Are you sure you want to discard this submission?";

              if(confirm(confirmMsg)) {
                  await remove(ref(db, `submissions/${id}`));
                  alert("🗑️ Removed from the servers successfully.");
              }
          });
      });
  });

  function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
  }
</script>
</body>
</html>
